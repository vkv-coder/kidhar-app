# Secondary/backup trigger only. GitHub Actions' schedule trigger proved
# unreliable here - observed gaps of several hours instead of 15 minutes
# (see cron-check history), which delayed real staff alerts. The primary
# trigger is now a pg_cron job ('kidhar-idle-check', every 5 min) running
# inside the Supabase project itself - see
# supabase/migration_pg_cron_idle_check.sql. This workflow is left running
# as a harmless fallback: the Edge Function marks each alert sent
# (alerted_at / last_alert_sent_at), so a duplicate call here is a no-op.
name: Kidhar idle/shift check

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  idle-check:
    runs-on: ubuntu-latest
    steps:
      - name: Call kidhar-idle-check Edge Function
        run: |
          resp=$(curl -s -w "\n%{http_code}" \
            "https://wrzpgultvahxbrgooibn.supabase.co/functions/v1/kidhar-idle-check" \
            -H "X-Cron-Secret: ${{ secrets.KIDHAR_CRON_SECRET }}")
          body=$(echo "$resp" | head -n -1)
          status=$(echo "$resp" | tail -n1)
          echo "Response: $body (HTTP $status)"
          if [ "$status" -ge 300 ]; then
            echo "idle-check call failed"
            exit 1
          fi
